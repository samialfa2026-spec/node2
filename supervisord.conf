[supervisord]
nodaemon=true
loglevel=info

[program:bitpingd]
command=/usr/local/bin/bitpingd login --email %(ENV_BITPING_EMAIL)s --password %(ENV_BITPING_PASSWORD)s && /usr/local/bin/bitpingd
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:repocket]
command=node /app/repocket/index.js
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
